<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حجز الكتاب | Zatune Book Shop</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .bookingPage {
            min-height: 100vh;
            background-color: #0171F9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            box-sizing: border-box;
        }


        .bookingBox {
            width: 500px;
            max-width: 100%;
            background-color: #fff;
            border-radius: 25px;
            padding: 35px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            font-family: "Alexandria", sans-serif;
        }


        .bookingBox h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }


        .bookingBox .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }


        .bookName {
            background-color: #f1f1f1;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            color: #0171F9;
            line-height: 1.8;
        }


        .formGroup {
            margin-bottom: 20px;
        }


        .formGroup label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }


        .formGroup input {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 0 15px;
            box-sizing: border-box;
            outline: none;
            font-family: "Alexandria", sans-serif;
            font-size: 14px;
        }


        .formGroup input:focus {
            border-color: #0171F9;
        }


        .uploadBox {
            border: 2px dashed #0171F9;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }


        .uploadBox:hover {
            background-color: #f5f9ff;
        }


        .uploadBox input {
            display: none;
        }


        .uploadText {
            color: #0171F9;
            font-weight: 600;
        }


        .fileName {
            margin-top: 10px;
            color: #777;
            font-size: 13px;
        }


        .bookingBtn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 50px;
            background-color: #EE626B;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: "Alexandria", sans-serif;
            transition: 0.3s;
        }


        .bookingBtn:hover {
            background-color: #9E4147;
            transform: translateY(-3px);
        }


        .bookingBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #0171F9;
        }


        .successBox {
            display: none;
            text-align: center;
        }


        .successIcon {
            font-size: 60px;
            margin-bottom: 10px;
        }


        .successBox h2 {
            color: #222;
        }


        .successBox p {
            color: #777;
            line-height: 1.8;
        }


        .bookingCode {
            background-color: #0171F9;
            color: white;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            direction: ltr;
        }


        .backBtn {
            display: inline-block;
            text-decoration: none;
            color: #0171F9;
            font-weight: 600;
            margin-top: 10px;
        }

    </style>

</head>


<body>


    <div class="bookingPage">


        <div class="bookingBox">


            <!-- =========================
                 FORM
            ========================== -->

            <div id="bookingForm">


                <h1>
                    حجز الكتاب
                </h1>


                <p class="subtitle">
                    قم بإدخال بياناتك لإتمام الحجز
                </p>


                <!-- اسم الكتاب -->

                <div
                    class="bookName"
                    id="bookName"
                >
                    جاري تحميل الكتاب...
                </div>


                <!-- اسم الطالب -->

                <div class="formGroup">

                    <label>
                        اسم الطالب
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="اكتب اسمك بالكامل"
                    >

                </div>


                <!-- رقم الهاتف -->

                <div class="formGroup">

                    <label>
                        رقم الهاتف
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="01xxxxxxxxx"
                    >

                </div>


                <!-- رفع الصورة -->

                <div class="formGroup">

                    <label>
                        رفع الصورة
                    </label>


                    <label class="uploadBox">

                        <input
                            type="file"
                            id="studentImage"
                            accept="image/*"
                        >


                        <div class="uploadText">

                            📷 اضغط لاختيار الصورة

                        </div>


                        <div
                            class="fileName"
                            id="fileName"
                        >

                            لم يتم اختيار صورة

                        </div>

                    </label>

                </div>


                <!-- زر الحجز -->

                <button
                    class="bookingBtn"
                    id="bookingBtn"
                >

                    إتمام حجز الكتاب

                </button>


                <div
                    class="loading"
                    id="loading"
                >

                    جاري تسجيل الحجز...

                </div>


            </div>


            <!-- =========================
                 SUCCESS
            ========================== -->

            <div
                class="successBox"
                id="successBox"
            >


                <div class="successIcon">

                    ✅

                </div>


                <h2>

                    تم الحجز بنجاح

                </h2>


                <p>

                    كود الحجز الخاص بك:

                </p>


                <div
                    class="bookingCode"
                    id="bookingCode"
                >

                    ZTN-0001

                </div>


                <p>

                    احتفظ بهذا الكود لاستخدامه عند استلام الكتاب.

                </p>


                <a
                    href="index.html"
                    class="backBtn"
                >

                    العودة للرئيسية

                </a>


            </div>


        </div>

    </div>



<script>


    // ==========================================
    // معرفة الكتاب من الرابط
    // ==========================================

    const params =
        new URLSearchParams(window.location.search);


    const book =
        params.get("book");


    const bookName =
        document.getElementById("bookName");


    // ==========================================
    // أسماء الكتب
    // ==========================================

    const books = {

        physics:
            "فيزياء تالتة ثانوي - كتاب الكهربية - محمد عبدالمعبود",

        arabic:
            "لغة عربية تالتة ثانوي - كتاب الترم الأول - محمد صلاح",

        arabic1:
            "لغة عربية أولى بكالوريا - كتاب الترم الأول - محمد صلاح",

        arabic2:
            "لغة عربية تانية بكالوريا - كتاب الترم الأول - محمد صلاح"

    };


    // ==========================================
    // عرض اسم الكتاب
    // ==========================================

    if (book && books[book]) {

        bookName.textContent =
            books[book];

    } else {

        bookName.textContent =
            "الكتاب غير محدد";

    }



    // ==========================================
    // رفع الصورة
    // ==========================================

    const imageInput =
        document.getElementById("studentImage");


    const fileName =
        document.getElementById("fileName");


    imageInput.addEventListener(
        "change",
        function () {

            if (imageInput.files.length > 0) {

                fileName.textContent =
                    imageInput.files[0].name;

            } else {

                fileName.textContent =
                    "لم يتم اختيار صورة";

            }

        }
    );



    // ==========================================
    // زر الحجز
    // ==========================================

    const bookingBtn =
        document.getElementById("bookingBtn");


    const loading =
        document.getElementById("loading");


    bookingBtn.addEventListener(
        "click",
        function () {


            const name =
                document
                .getElementById("studentName")
                .value
                .trim();


            const phone =
                document
                .getElementById("phone")
                .value
                .trim();


            const image =
                imageInput.files[0];



            // ==================================
            // التحقق من البيانات
            // ==================================

            if (name === "") {

                alert(
                    "من فضلك اكتب اسم الطالب"
                );

                return;

            }


            if (phone === "") {

                alert(
                    "من فضلك اكتب رقم الهاتف"
                );

                return;

            }


            if (!image) {

                alert(
                    "من فضلك ارفع الصورة"
                );

                return;

            }



            // ==================================
            // Loading
            // ==================================

            loading.style.display =
                "block";


            bookingBtn.disabled =
                true;



            // ==================================
            // مؤقت مؤقت للتجربة
            // ==================================

            setTimeout(
                function () {


                    loading.style.display =
                        "none";


                    document
                        .getElementById("bookingForm")
                        .style.display = "none";


                    document
                        .getElementById("successBox")
                        .style.display = "block";


                    document
                        .getElementById("bookingCode")
                        .textContent = "ZTN-0001";


                },
                1000
            );

        }
    );

</script>


</body>

</html>
