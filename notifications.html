<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zatune | الإشعارات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#20242b;font-family:Alexandria,Arial,sans-serif}
header{background:#0171F9;color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}
header h1{margin:0;font-size:20px}
header button{border:0;border-radius:12px;padding:11px 17px;background:#fff;color:#0171F9;font-family:inherit;font-weight:700;cursor:pointer}
.container{width:min(1050px,92%);margin:30px auto}
.grid{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start}
.box{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0000000c}
h2{font-size:18px;margin:0 0 18px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:11px;padding:11px 12px;font-family:inherit;outline:none;background:#fff}
input,select{height:45px}
textarea{min-height:130px;resize:vertical;line-height:1.8}
input:focus,select:focus,textarea:focus{border-color:#0171F9}
.primary{width:100%;border:0;border-radius:11px;padding:13px 15px;font-family:inherit;font-weight:700;cursor:pointer;background:#0171F9;color:#fff;margin-top:18px}
.primary:disabled{opacity:.6;cursor:not-allowed}
.secondary{border:0;border-radius:11px;padding:10px 14px;font-family:inherit;font-weight:700;cursor:pointer;background:#eee;color:#333}
.msg{display:none;margin-top:12px;padding:11px;border-radius:10px;font-size:12px;line-height:1.8}
.msg.ok{display:block;background:#ecfff3;color:#167847}
.msg.err{display:block;background:#fff0f1;color:#c62828}
.info{background:#f7f9fc;border-radius:13px;padding:13px;font-size:11px;line-height:1.9;color:#666;margin-top:15px}
.stat{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.stat div{background:#f7f9fc;border-radius:12px;padding:11px 14px;font-size:11px;min-width:120px}
.stat b{font-size:17px;display:block;margin-top:3px}
.tableWrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:right;vertical-align:middle}
th{color:#777;font-size:10px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:700;background:#eaf3ff;color:#0171F9}
.empty{text-align:center;color:#888;padding:30px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.container{width:95%}}
</style>
</head>
<body>

<header>
  <h1>🔔 إدارة الإشعارات</h1>
  <div style="display:flex;gap:8px">
    <button id="dashboardBtn">لوحة التحكم</button>
    <button id="logoutBtn">تسجيل الخروج</button>
  </div>
</header>

<div class="container">
  <div class="grid">

    <section class="box">
      <h2>📢 إرسال إشعار جديد</h2>

      <label>إرسال إلى</label>
      <select id="targetType">
        <option value="all">📢 كل الطلاب</option>
        <option value="book">📚 طلاب كتاب معين</option>
        <option value="student">👤 طالب معين</option>
      </select>

      <div id="bookTarget" style="display:none">
        <label>اختر الكتاب</label>
        <select id="bookSelect">
          <option value="">جاري تحميل الكتب...</option>
        </select>
      </div>

      <div id="studentTarget" style="display:none">
        <label>اختر الطالب</label>
        <select id="studentSelect">
          <option value="">جاري تحميل الطلاب...</option>
        </select>
      </div>

      <label>عنوان الإشعار</label>
      <input id="title" maxlength="120" placeholder="مثال: 📚 الكتاب وصل!">

      <label>نص الإشعار</label>
      <textarea id="message" maxlength="1000" placeholder="اكتب الرسالة التي ستظهر للطالب..."></textarea>

      <button class="primary" id="sendBtn">🚀 إرسال الإشعار</button>
      <div id="msg" class="msg"></div>

      <div class="info">
        <b>مثال لو الكتاب وصل:</b><br>
        اختر <b>طلاب كتاب معين</b> ثم اختر الكتاب، واكتب رسالة مثل:
        <br><br>
        📚 كتاب الفيزياء وصل ويمكنك الآن التوجه لاستلامه.
      </div>
    </section>

    <section>
      <div class="stat">
        <div>📢 آخر الإشعارات<b id="count">0</b></div>
        <div>👨‍🎓 الطلاب<b id="studentCount">0</b></div>
        <div>📚 الكتب<b id="bookCount">0</b></div>
      </div>

      <div class="box">
        <h2>📋 سجل الإشعارات المرسلة</h2>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>العنوان</th>
                <th>الرسالة</th>
                <th>الطالب</th>
                <th>التاريخ</th>
              </tr>
            </thead>
            <tbody id="notificationsBody">
              <tr><td colspan="4" class="empty">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
const SUPABASE_URL = "https://ddqjdcurwlffsmrkcylo.supabase.co";
const SUPABASE_KEY = "sb_publishable_OuHtmXoZZGqj46tD1Top6A_hmnz5f1o";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

let books = [];
let students = [];

function showMsg(text, type){
  const el = $("msg");
  el.textContent = text;
  el.className = "msg " + type;
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function checkAdmin(){
  const {data:{session}} = await client.auth.getSession();

  if(!session){
    window.location.href = "login.html";
    return false;
  }

  const {data,error} = await client
    .from("admin_users")
    .select("id")
    .eq("id",session.user.id)
    .maybeSingle();

  if(error || !data){
    alert("غير مصرح لك بالدخول إلى صفحة الإشعارات.");
    window.location.href = "index.html";
    return false;
  }

  return true;
}

async function loadBooks(){
  const {data,error} = await client
    .from("books")
    .select("id,name,book_code,teacher")
    .order("name");

  if(error){
    console.error(error);
    return;
  }

  books = data || [];
  $("bookCount").textContent = books.length;

  $("bookSelect").innerHTML =
    '<option value="">اختر الكتاب</option>' +
    books.map(b =>
      `<option value="${b.id}">
        ${escapeHtml(b.name)}${b.book_code ? " — " + escapeHtml(b.book_code) : ""}
      </option>`
    ).join("");
}

async function loadStudents(){
  const {data,error} = await client
    .from("profiles")
    .select("id,full_name,phone,student_code")
    .order("full_name");

  if(error){
    console.error(error);
    return;
  }

  students = data || [];
  $("studentCount").textContent = students.length;

  $("studentSelect").innerHTML =
    '<option value="">اختر الطالب</option>' +
    students.map(s =>
      `<option value="${s.id}">
        ${escapeHtml(s.full_name || "بدون اسم")}${s.student_code ? " — " + escapeHtml(s.student_code) : ""}
      </option>`
    ).join("");
}

async function loadNotifications(){
  const {data,error} = await client
    .from("notifications")
    .select("id,user_id,title,message,created_at")
    .order("created_at",{ascending:false})
    .limit(50);

  if(error){
    console.error(error);
    $("notificationsBody").innerHTML =
      `<tr><td colspan="4" class="empty">تعذر تحميل الإشعارات: ${escapeHtml(error.message)}</td></tr>`;
    return;
  }

  const rows = data || [];
  $("count").textContent = rows.length;

  const names = {};
  students.forEach(s => names[s.id] = s.full_name || "طالب");

  if(!rows.length){
    $("notificationsBody").innerHTML =
      '<tr><td colspan="4" class="empty">لا توجد إشعارات مرسلة حتى الآن.</td></tr>';
    return;
  }

  $("notificationsBody").innerHTML = rows.map(n => {
    const date = new Date(n.created_at).toLocaleString("ar-EG");
    return `
      <tr>
        <td><span class="badge">${escapeHtml(n.title)}</span></td>
        <td>${escapeHtml(n.message)}</td>
        <td>${escapeHtml(names[n.user_id] || "طالب")}</td>
        <td>${escapeHtml(date)}</td>
      </tr>
    `;
  }).join("");
}

$("targetType").addEventListener("change", function(){
  $("bookTarget").style.display = this.value === "book" ? "block" : "none";
  $("studentTarget").style.display = this.value === "student" ? "block" : "none";
});

$("dashboardBtn").addEventListener("click", () => {
  window.location.href = "admin.html";
});

$("logoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "login.html";
});

$("sendBtn").addEventListener("click", async () => {
  const targetType = $("targetType").value;
  const title = $("title").value.trim();
  const message = $("message").value.trim();

  if(!title || !message){
    showMsg("اكتب عنوان الإشعار والرسالة أولاً.", "err");
    return;
  }

  if(targetType === "book" && !$("bookSelect").value){
    showMsg("اختر الكتاب أولاً.", "err");
    return;
  }

  if(targetType === "student" && !$("studentSelect").value){
    showMsg("اختر الطالب أولاً.", "err");
    return;
  }

  $("sendBtn").disabled = true;
  $("sendBtn").textContent = "جاري الإرسال...";

  try {
    let userIds = [];
    let bookId = null;

    if(targetType === "all"){
      userIds = students.map(s => s.id);
    }

    if(targetType === "student"){
      userIds = [$("studentSelect").value];
    }

    if(targetType === "book"){
      bookId = Number($("bookSelect").value);

      const {data,error} = await client
        .from("reservations")
        .select("user_id")
        .eq("book_id",bookId);

      if(error) throw error;

      userIds = [...new Set((data || []).map(r => r.user_id).filter(Boolean))];

      if(!userIds.length){
        showMsg("لا يوجد طلاب حاجزين هذا الكتاب حتى الآن.", "err");
        return;
      }
    }

    if(!userIds.length){
      showMsg("لا يوجد طلاب لإرسال الإشعار إليهم.", "err");
      return;
    }

    const rows = userIds.map(userId => ({
      user_id: userId,
      title: title,
      message: message,
      is_read: false
    }));

    const {data: insertedNotifications, error} = await client
      .from("notifications")
      .insert(rows)
      .select("id,user_id,title,message,is_read,created_at");

    if(error) throw error;

    console.log("Inserted notifications:", insertedNotifications);

    showMsg(`تم إرسال الإشعار بنجاح إلى ${userIds.length} طالب/طلاب ✅`, "ok");

    $("title").value = "";
    $("message").value = "";

    await loadNotifications();

  } catch(error){
    console.error(error);
    showMsg("حدث خطأ أثناء إرسال الإشعار: " + error.message, "err");
  } finally {
    $("sendBtn").disabled = false;
    $("sendBtn").textContent = "🚀 إرسال الإشعار";
  }
});

(async function init(){
  const isAdmin = await checkAdmin();
  if(!isAdmin) return;

  await Promise.all([
    loadBooks(),
    loadStudents()
  ]);

  await loadNotifications();
})();
</script>

</body>
</html>
